name: Technology Compatibility

on:
  pull_request:
    paths:
      - requirements.txt
      - scripts/**
      - schemas/**
      - manifest.yaml
      - registry/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - requirements.txt
      - scripts/**
      - schemas/**
      - manifest.yaml
      - registry/**
      - .github/workflows/**

jobs:
  compatibility:
    name: Validate with supported Python runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate manifest
        run: python scripts/validate-manifest.py manifest.yaml

      - name: Check registry
        run: python scripts/check-registry.py
