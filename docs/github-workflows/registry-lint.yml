name: Registry Lint

on:
  pull_request:
    paths:
      - "registry/index.yaml"
      - "schemas/registry.schema.yaml"
  push:
    branches:
      - main
    paths:
      - "registry/index.yaml"
      - "schemas/registry.schema.yaml"

jobs:
  lint:
    name: Lint registry/index.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema pyyaml

      - name: Run registry health check
        run: |
          echo "=== AskJamie FoundRy — Registry Lint ==="
          python3 scripts/check-registry.py
